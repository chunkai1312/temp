<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1045" viewBox="0 55 1800 1045">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#15803d"/></marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#ea580c"/></marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#7e22ce"/></marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
    <style>
      text { font-family: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 700; }
      .section-title { font-size: 20px; font-weight: 700; }
      .zone-title { font-size: 16px; font-weight: 700; }
      .node-title { font-size: 14px; font-weight: 700; }
      .node-sub { font-size: 11px; fill: #475569; }
      .edge-label { font-size: 11px; font-weight: 600; paint-order: stroke; stroke: #fff; stroke-width: 5px; stroke-linejoin: round; }
      .outer { fill: #fff; stroke: #334155; stroke-width: 2; rx: 14; }
      .azure-outer { fill: #f8fbff; stroke: #0078d4; stroke-width: 2.5; rx: 14; }
      .internal-zone { fill: #faf5ff; stroke: #7c3aed; stroke-width: 1.7; rx: 10; }
      .dmz-zone { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.7; rx: 10; }
      .hub-zone { fill: #f1f5f9; stroke: #2563eb; stroke-width: 1.6; rx: 10; }
      .app-zone { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.6; rx: 10; }
      .data-zone { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.6; rx: 10; }
      .platform-zone { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; rx: 10; }
      .external-zone { fill: #f8fafc; stroke: #64748b; stroke-width: 1.7; rx: 10; }
      .node { fill: #fff; stroke: #64748b; stroke-width: 1.3; rx: 8; filter: url(#shadow); }
      .node-blue { fill: #fff; stroke: #2563eb; stroke-width: 1.5; rx: 8; filter: url(#shadow); }
      .node-green { fill: #fff; stroke: #16a34a; stroke-width: 1.5; rx: 8; filter: url(#shadow); }
      .node-orange { fill: #fff; stroke: #ea580c; stroke-width: 1.5; rx: 8; filter: url(#shadow); }
      .node-purple { fill: #fff; stroke: #7e22ce; stroke-width: 1.5; rx: 8; filter: url(#shadow); }
      .blue { fill: none; stroke: #2563eb; stroke-width: 2.6; marker-end: url(#arrow-blue); }
      .green { fill: none; stroke: #15803d; stroke-width: 2.4; marker-end: url(#arrow-green); }
      .orange { fill: none; stroke: #ea580c; stroke-width: 2.6; marker-end: url(#arrow-orange); }
      .purple { fill: none; stroke: #7e22ce; stroke-width: 2.8; marker-end: url(#arrow-purple); }
      .gray { fill: none; stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 7 6; marker-end: url(#arrow-gray); }
      .green-dash { fill: none; stroke: #15803d; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow-green); }
    </style>
